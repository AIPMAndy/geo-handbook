name: Deploy GEO Handbook
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild static content
        run: python3 scripts/build.py
      - name: Validate build and sources
        run: python3 scripts/check.py
      - name: Unit tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: JavaScript syntax
        run: |
          node --check docs/assets/app.js
          node --check docs/assets/extras.js
          python3 scripts/site_audit.py --file examples/sample-broken.html --json > /tmp/site-audit-example.json
          python3 scripts/geo_report.py examples/synthetic-visibility.csv --json > /tmp/geo-analysis-example.json
      - name: Build original GEO operating modules
        run: |
          python3 scripts/build_operations.py
          python3 scripts/check_operations.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
