name: Deploy GEO Handbook
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild static content
        run: python3 scripts/build.py
      - name: Publish searchable, source-linked GEO PDF
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b poppler-utils
          python -m pip install --disable-pip-version-check weasyprint==68.0 markdown==3.10 pymupdf==1.26.6 pillow==12.0.0
          python3 scripts/build_pdf.py
          python3 scripts/pdf_quality_gate.py
          test -s docs/downloads/geo-handbook-guide.pdf
          pdfinfo pdf/geo-handbook-guide.pdf | grep -q 'Pages:'
          pdftotext pdf/geo-handbook-guide.pdf - | grep -q 'AIPMAndy'
      - name: Archive full-page PDF QA sheets
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: geo-handbook-pdf-qa
          path: artifacts/pdf-qa/
          if-no-files-found: warn
          retention-days: 30
      - name: Validate build and sources
        run: python3 scripts/check.py
      - name: Unit tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: JavaScript syntax
        run: |
          node --check docs/assets/app.js
          node --check docs/assets/extras.js
          python3 scripts/site_audit.py --file examples/sample-broken.html --json > /tmp/site-audit-example.json
          python3 scripts/geo_report.py examples/synthetic-visibility.csv --json > /tmp/geo-analysis-example.json
      - name: Build original GEO operating modules
        run: |
          python3 scripts/build_operations.py
          python3 scripts/check_operations.py
      - name: Synchronize the generated PDF to public repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pdf/geo-handbook-guide.pdf pdf/edition.json docs/downloads/geo-handbook-guide.pdf
          if ! git diff --cached --quiet; then
            git commit -m "docs(pdf): publish source-driven GEO edition"
            git push origin HEAD:main
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public Pages resources against build SHA-256
        run: |
          python3 - <<'PY'
          import hashlib, time, urllib.request
          from pathlib import Path
          base = 'https://aipmandy.github.io/geo-handbook/'
          assets = ('index.html', 'handbook.html', 'sources.html',
                    'sitemap.xml', 'robots.txt', 'downloads/geo-handbook-guide.pdf')
          for relative in assets:
              expected = hashlib.sha256((Path('docs') / relative).read_bytes()).hexdigest()
              last = ''
              for attempt in range(16):
                  try:
                      req = urllib.request.Request(base + relative, headers={'User-Agent': 'GEO-Pages-publication-QA/1.0'})
                      with urllib.request.urlopen(req, timeout=20) as response:
                          body = response.read()
                          status = response.status
                      actual = hashlib.sha256(body).hexdigest()
                      if status == 200 and actual == expected:
                          print(f'PASS HTTP 200 and SHA-256: {base}{relative}')
                          break
                      last = f'status={status} actual={actual} expected={expected}'
                  except Exception as exc:
                      last = repr(exc)
                  if attempt < 15:
                      time.sleep(5)
              else:
                  raise SystemExit(f'LIVE PAGE MISMATCH: {base}{relative}: {last}')
          print('All six public resources match this workflow build.')
          PY
